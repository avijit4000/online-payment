<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f6" />
    <title>Confirming PhonePe payment — RozPay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/phonepe-result.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="RozPay home"><span class="brand-mark">r</span><span>rozpay</span></a>
      <div class="secure-label"><span class="lock-icon" aria-hidden="true">⌑</span> Secure checkout</div>
    </header>
    <main class="result-layout">
      <section class="result-card" aria-labelledby="result-title">
        <div class="result-icon success-icon" id="status-icon" aria-hidden="true">…</div>
        <p class="section-label" id="status-label">PHONEPE PAYMENT</p>
        <h1 id="result-title">Confirming your payment</h1>
        <p class="result-copy" id="status-copy">We are checking the payment status securely with PhonePe. Please keep this page open.</p>
        <div class="payment-id-box"><span>ORDER REFERENCE</span><strong id="order-reference">—</strong></div>
        <a class="result-button" id="back-link" href="/" hidden>Return to checkout <span aria-hidden="true">→</span></a>
      </section>
    </main>
    <footer><span>© <span id="year"></span> RozPay Demo</span><span>Powered by <strong>PhonePe</strong></span></footer>
  </body>
</html>
